name: Deploy Reader to GitHub Pages
# Redeploy current reader release v1.0.39 after clearing queued runs.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the public bookshelf once daily at 00:17 UTC (08:17 Beijing time).
    - cron: '17 0 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reader
        uses: actions/checkout@v4
      # foliate-js is an ES-module library. Ship a pinned copy with the site,
      # rather than importing @main from jsDelivr at runtime.
      - name: Checkout pinned foliate-js
        uses: actions/checkout@v4
        with:
          repository: johnfactotum/foliate-js
          ref: 78914aef4466eb960965702401634c2cb348e9b1
          path: vendor/foliate-js
          persist-credentials: false
      - name: Verify offline MOBI dependencies
        run: |
          node --check app.js
          node --check sw.js
          node --check selection.js
          node --check vendor/foliate-js/view.js
          node --check vendor/foliate-js/mobi.js
          node --check vendor/foliate-js/paginator.js
          for file in view.js mobi.js paginator.js epubcfi.js progress.js overlayer.js text-walker.js vendor/fflate.js; do
            test -s "vendor/foliate-js/$file" || (echo "Missing foliate dependency: $file" && exit 1)
          done
      - name: Generate online bookshelf from TOS
        env:
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
        run: |
          python3 -m py_compile scripts/sync_tos_catalog.py
          if [ -n "$TOS_ACCESS_KEY" ] && [ -n "$TOS_SECRET_KEY" ]; then
            python3 -m pip install --disable-pip-version-check tos
          fi
          python3 scripts/sync_tos_catalog.py
      - name: Remove Git checkout metadata
        run: rm -rf vendor/foliate-js/.git
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
