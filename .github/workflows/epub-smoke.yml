name: EPUB reader interaction test
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  epub-tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned foliate-js
        uses: actions/checkout@v4
        with:
          repository: johnfactotum/foliate-js
          ref: 78914aef4466eb960965702401634c2cb348e9b1
          path: vendor/foliate-js
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-save --no-package-lock playwright jszip
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start static site
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/reader-http.log 2>&1 &
      - name: Verify Chromium EPUB tap
        run: node tests/epub-tap.cjs
      - name: Verify WebKit EPUB tap
        run: BROWSER=webkit node tests/epub-tap.cjs
      - name: Verify Chromium foliate EPUB compatibility
        run: node tests/foliate-epub.cjs
      - name: Verify WebKit foliate EPUB compatibility
        run: BROWSER=webkit node tests/foliate-epub.cjs
      - name: Verify Chromium seamless chapter scrolling
        run: node tests/continuous-scroll.cjs
      - name: Verify WebKit seamless chapter scrolling
        run: BROWSER=webkit node tests/continuous-scroll.cjs
      - name: Verify Chromium production EPUB continuous reader
        run: node tests/continuous-production.cjs
      - name: Verify WebKit production EPUB continuous reader
        run: BROWSER=webkit node tests/continuous-production.cjs
      - name: Verify Chromium shared book auto-import
        run: node tests/shared-book-import.cjs
      - name: Verify WebKit shared book auto-import
        run: BROWSER=webkit node tests/shared-book-import.cjs
      - name: Verify Chromium online TOS bookshelf
        run: node tests/online-library.cjs
      - name: Verify WebKit online TOS bookshelf
        run: BROWSER=webkit node tests/online-library.cjs
      - name: Verify Chromium note share image
        run: node tests/note-share.cjs
      - name: Verify WebKit note share image
        run: BROWSER=webkit node tests/note-share.cjs
      - name: Verify Chromium annotation tap priority
        run: node tests/note-tap-priority.cjs
      - name: Verify WebKit annotation tap priority
        run: BROWSER=webkit node tests/note-tap-priority.cjs
      - name: Verify Chromium reading header book share
        run: node tests/book-share.cjs
      - name: Verify WebKit reading header book share
        run: BROWSER=webkit node tests/book-share.cjs
      - name: Verify Chromium mobile reading resume after pagehide
        run: node tests/mobile-reading-resume.cjs
      - name: Verify WebKit mobile reading resume after pagehide
        run: BROWSER=webkit node tests/mobile-reading-resume.cjs
      - name: Verify Chromium MOBI native chapter scrolling
        run: node tests/mobi-continuous.cjs
      - name: Verify WebKit MOBI native chapter scrolling
        run: BROWSER=webkit node tests/mobi-continuous.cjs
