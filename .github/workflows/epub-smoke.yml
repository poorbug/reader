name: EPUB reader interaction test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  epub-tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-save --no-package-lock playwright jszip
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static site
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/reader-http.log 2>&1 &
      - name: Verify EPUB tap opens and closes toolbar
        run: node tests/epub-tap.cjs
