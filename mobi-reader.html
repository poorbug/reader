<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f6f0e5;color:#343b34;font-family:-apple-system,"PingFang SC",sans-serif}
#status{padding:20px}#holder{position:absolute;inset:0;width:100%;overflow:hidden}#menu-toggle{position:fixed;z-index:20;right:12px;bottom:18px;border:0;border-radius:24px;padding:10px 15px;background:#4b8174;color:white}#menu,#toc-panel{position:fixed;z-index:21;bottom:65px;left:12px;right:12px;max-height:65%;overflow:auto;padding:16px;background:var(--mobi-bg,#f6f0e5);color:var(--mobi-fg,#343b34);box-shadow:0 4px 25px #0003;border-radius:14px}#menu[hidden],#toc-panel[hidden]{display:none}.toc-row{display:block;padding:13px 8px;width:100%;background:transparent;color:inherit;border:0;text-align:left;border-bottom:1px solid currentColor}#menu label{display:block;margin:12px 0}#menu input{width:100%}foliate-view{display:block;width:100%;height:100%;touch-action:pan-y}
</style></head><body><div id="status">正在等待 MOBI 文件…</div><div id="holder"></div><button id="menu-toggle" hidden aria-label="阅读设置">Aa</button><div id="menu" hidden><button id="toc-toggle">目录</button><button id="close-menu">关闭</button><label>字号 <input id="size" type="range" min="14" max="32" value="18"></label><label>行距 <input id="lineHeight" type="range" min="1.3" max="2.5" step="0.1" value="1.8"></label><label>背景 <select id="theme"><option value="paper">纸张</option><option value="white">白色</option><option value="green">护眼</option><option value="dark">夜间</option></select></label></div><div id="toc-panel" hidden></div><script src="./selection.js"></script><script type="module">
let view,changing=false,lastChange=0,bookId=null,initialSection=null,initialCFI=null,noteMap=new Map(),notesDrawn=new WeakMap(),noteDrawTimer=null,prefs={size:18,lineHeight:1.8,theme:'paper'};
const themes={paper:['#f6f0e5','#333b34'],white:['#ffffff','#222222'],green:['#e6eee6','#294034'],dark:['#26292b','#eeeeee']};
function applyPrefs(){if(!view?.renderer)return;const [bg,fg]=themes[prefs.theme]||themes.paper;document.body.style.background=bg;document.body.style.color=fg;document.documentElement.style.setProperty('--mobi-bg',bg);document.documentElement.style.setProperty('--mobi-fg',fg);view.renderer.setStyles?.(`html,body{background:${bg}!important;color:${fg}!important;font-size:${prefs.size}px!important;line-height:${prefs.lineHeight}!important} body{padding-inline:${prefs.margin||18}px!important;box-sizing:border-box!important} p{margin-bottom:${prefs.paragraph??0.8}em!important} h1,h1 *, .chapter-title,.chapter-title *{font-size:${Math.min(40,Math.max(20,Math.round(prefs.size*1.4)))}px!important;line-height:1.5!important;overflow-wrap:anywhere!important}h2,h2 *{font-size:${Math.round(prefs.size*1.2)}px!important;line-height:1.5!important}h3,h3 *{font-size:${Math.round(prefs.size*1.1)}px!important;line-height:1.5!important}`);normalizeBookHeadings();fixLegacyMobiTitles()}
function normalizeBookHeadings(){
 if(!view?.renderer)return;
 let docs=[];try{docs=view.renderer.getContents().map(x=>x.doc).filter(Boolean)}catch{}
 for(const doc of docs){
  const main=doc.body;if(!main)continue;
  const candidates=[...main.querySelectorAll('h1,h2,h3,font,[style*="font-size"],[size],p,div')].slice(0,150);
  let hits=0;
  for(const el of candidates){
   if(hits>=12)break;
   const text=(el.textContent||'').trim();
   if(!text||text.length>90||el.querySelector('img,svg,table'))continue;
   if(['DIV','P'].includes(el.tagName)&&el.children.length>2)continue;
   const computed=doc.defaultView?.getComputedStyle(el);
   const px=parseFloat(computed?.fontSize)||0;
   const isHeading=/^H[1-3]$/.test(el.tagName)||/chapter|title|heading|bt|biaoti/i.test(String(el.className||''));
   const isOversized=px>Math.max(32,prefs.size*1.65);
   if(!isHeading&&!isOversized)continue;
   const ratio=el.tagName==='H2'?1.2:el.tagName==='H3'?1.1:1.4;
   const wanted=Math.min(40,Math.max(18,Math.round(prefs.size*ratio)));
   el.style.setProperty('font-size',wanted+'px','important');
   el.style.setProperty('line-height','1.5','important');
   el.style.setProperty('overflow-wrap','anywhere','important');
   for(const child of el.querySelectorAll('font,span,b,strong,i,em'))child.style.setProperty('font-size','inherit','important');
   hits++;
  }
 }
}
function fixLegacyMobiTitles(){
 if(!view?.renderer)return;
 let contents=[];try{contents=view.renderer.getContents()}catch{return}
 for(const item of contents){
  const doc=item.doc;if(!doc?.body)continue;
  const titlePx=Math.min(40,Math.max(18,Math.round(prefs.size*1.4)));
  for(const font of doc.querySelectorAll('p > font[size],p > a + font[size]')){
   const raw=font.getAttribute('size');const n=Number(raw);
   if(!Number.isFinite(n)||n<5)continue;
   const text=(font.textContent||'').trim();
   if(!text||text.length>90||font.querySelector('img,table'))continue;
   const p=font.closest('p');
   if(!p||p.textContent.trim().length>110)continue;
   font.dataset.zhijianHeading='true';
   font.style.setProperty('font-size',titlePx+'px','important');
   font.style.setProperty('line-height','1.5','important');
   for(const child of font.querySelectorAll('*'))child.style.setProperty('font-size','inherit','important');
  }
 }
}
function report(detail){let cfi=detail?.cfi||detail?.start?.cfi||detail?.location?.cfi||null;let percent=detail?.fraction??detail?.location?.fraction??null;parent.postMessage({type:'MOBI_PROGRESS',bookId,cfi,percent,sectionIndex:detail?.index??detail?.location?.index??null},location.origin)}
function renderToc(){const toc=view?.book?.toc||[];const draw=items=>items.map(item=>`<button class="toc-row" data-href="${String(item.href||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${String(item.label||'章节').replace(/</g,'&lt;')}</button>${draw(item.subitems||[])}`).join('');let panel=document.querySelector('#toc-panel');panel.innerHTML=draw(toc);panel.querySelectorAll('[data-href]').forEach(el=>el.onclick=async()=>{try{await view.goTo(el.dataset.href);panel.hidden=true}catch(e){console.warn(e)}})}
const status=document.getElementById('status');
const menu=document.getElementById('menu');document.getElementById('menu-toggle').onclick=()=>menu.hidden=!menu.hidden;document.getElementById('toc-toggle').onclick=()=>{document.getElementById('toc-panel').hidden=false;menu.hidden=true};document.getElementById('close-menu').onclick=()=>menu.hidden=true;for(const key of ['size','lineHeight'])document.getElementById(key).oninput=e=>{prefs[key]=Number(e.target.value);applyPrefs();parent.postMessage({type:'MOBI_PREFS',prefs},location.origin)};document.getElementById('theme').onchange=e=>{prefs.theme=e.target.value;applyPrefs();parent.postMessage({type:'MOBI_PREFS',prefs},location.origin)};
async function switchSection(dir){
 if(!view||changing||Date.now()-lastChange<650)return;
 changing=true;
 try{if(dir>0)await view.next();else await view.prev();lastChange=Date.now()}finally{changing=false}
}
// Custom touch selection: no Safari selection menu. Highlight using overlay rectangles.
function underlinedRects(rects){
 const group=document.createElementNS('http://www.w3.org/2000/svg','g');
 group.setAttribute('fill','#5a9d8b');
 for(const r of rects){
  const line=document.createElementNS('http://www.w3.org/2000/svg','rect');
  line.setAttribute('x',String(r.left));
  line.setAttribute('y',String(r.bottom-2.5));
  line.setAttribute('width',String(r.width));
  line.setAttribute('height','2.5');
  group.append(line);
 }
 return group;
}
function scheduleNoteDrawing(){clearTimeout(noteDrawTimer);noteDrawTimer=setTimeout(drawMobiAnnotations,120)}
function drawMobiAnnotations(){
 if(!view?.renderer)return;
 const sections=[];try{sections.push(...view.renderer.getContents())}catch{return}
 for(const section of sections){
  if(!section.doc||typeof section.index!=='number')continue;
  let drawn=notesDrawn.get(section.doc);
  if(!drawn){drawn=new Set();notesDrawn.set(section.doc,drawn)}
  for(const note of noteMap.values()){
   if(!note.cfi||!note.note?.trim()||drawn.has(note.cfi))continue;
   try{
    if(view.resolveNavigation(note.cfi)?.index!==section.index)continue;
    drawn.add(note.cfi);
    Promise.resolve(view.addAnnotation({value:note.cfi})).catch(err=>{drawn.delete(note.cfi);console.warn('MOBI annotation draw failed',err)});
   }catch(err){console.warn('Cannot render note in current section',err)}
  }
 }
}
function removeMobiNote(note){
 if(!view||!note?.cfi)return;
 try{view.deleteAnnotation({value:note.cfi})?.catch?.(console.warn)}catch(err){console.warn(err)}
 try{for(const content of view.renderer.getContents())notesDrawn.get(content.doc)?.delete(note.cfi)}catch{}
}
function updateMobiNote(note){
 if(!note?.id)return;
 const prior=noteMap.get(note.id);
 if(prior?.cfi&&prior.cfi!==note.cfi)removeMobiNote(prior);
 if(note.note?.trim())noteMap.set(note.id,note);else{noteMap.delete(note.id);removeMobiNote(note)}
 scheduleNoteDrawing();
}
function legacyQuoteRange(doc,quote){
 if(!doc?.body||!quote||quote.length<12||quote.length>350)return null;
 const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
 const nodes=[];let text='',n;
 while((n=walker.nextNode())&&text.length<700000){
  if(n.parentElement?.closest('script,style,svg,[data-zhj-selection-overlay]'))continue;
  const value=n.nodeValue||'';if(!value)continue;
  nodes.push({node:n,offset:text.length,length:value.length});text+=value;
 }
 const found=text.indexOf(quote);if(found<0||text.indexOf(quote,found+1)!==-1)return null;
 const last=found+quote.length;
 const start=nodes.find(x=>x.offset<=found&&x.offset+x.length>found);
 const end=nodes.find(x=>x.offset<last&&x.offset+x.length>=last);
 if(!start||!end)return null;
 try{const range=doc.createRange();range.setStart(start.node,found-start.offset);range.setEnd(end.node,last-end.offset);return range}catch{return null}
}
function locateLegacyMobiNotes(doc,index){
 if(!view||typeof index!=='number')return;
 for(const note of noteMap.values()){
  if(note.cfi||!note.note?.trim())continue;
  const range=legacyQuoteRange(doc,note.text);
  if(!range)continue;
  try{
   const cfi=view.getCFI(index,range);
   if(cfi){note.cfi=cfi;noteMap.set(note.id,note);parent.postMessage({type:'MOBI_NOTE_LOCATED',noteId:note.id,cfi},location.origin)}
  }catch(err){console.warn('Cannot locate older note',err)}
 }
}
function wireTouch(doc){
 if(!doc||doc.__zhijianSwipe)return;
 doc.__zhijianSwipe=true;const controller=window.ZhijianSelection?.install(doc,{onChange:detail=>{{let cfi=null;if(detail?.range&&view){try{const match=view.renderer.getContents().find(x=>x.doc===doc);if(match)cfi=view.getCFI(match.index,detail.range)}catch(err){console.warn('MOBI selection location unavailable',err)}}parent.postMessage({type:'ZHJ_SELECTION',format:'mobi',text:detail?.text||'',cfi},location.origin)}}});
 doc.documentElement.style.touchAction='pan-y';doc.documentElement.style.webkitTouchCallout='none';doc.body.style.webkitTouchCallout='none';doc.addEventListener('contextmenu',e=>e.preventDefault());
 doc.addEventListener('touchmove',()=>{if(!doc.__zhijianSelecting)parent.postMessage({type:'READER_SCROLL'},location.origin)},{passive:true});
 doc.addEventListener('wheel',()=>parent.postMessage({type:'READER_SCROLL'},location.origin),{passive:true});
 doc.body.style.touchAction='pan-y';
 let tapStartX=0,tapStartY=0,tapStartTime=0;
 doc.addEventListener('touchstart',ev=>{if(ev.touches.length!==1)return;tapStartX=ev.touches[0].clientX;tapStartY=ev.touches[0].clientY;tapStartTime=Date.now()},{passive:true});
 doc.addEventListener('touchend',ev=>{if(!ev.changedTouches.length||Date.now()-tapStartTime>350)return;const t=ev.changedTouches[0];if(Math.abs(t.clientX-tapStartX)>12||Math.abs(t.clientY-tapStartY)>12)return;if(doc.__zhijianSelecting||doc.__zhijianSelectionActive)return;parent.postMessage({type:'READER_TAP'},location.origin)},{passive:true});
 let startY=0,edge=false;
 doc.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  startY=e.touches[0].clientY;
  const r=view?.renderer;
  edge=!!r&&(r.scrolled && (r.viewSize-r.end<8||r.start<8));
 },{passive:true});
 doc.addEventListener('touchend',e=>{
  if(!edge||!e.changedTouches.length)return;
  const delta=startY-e.changedTouches[0].clientY,r=view?.renderer;
  if(delta>45&&r.viewSize-r.end<12)switchSection(1);
  else if(delta< -45&&r.start<12)switchSection(-1);
 },{passive:true});
 doc.addEventListener('wheel',e=>{
  const r=view?.renderer;
  if(!r?.scrolled)return;
  if(e.deltaY>0&&r.viewSize-r.end<8)switchSection(1);
  if(e.deltaY<0&&r.start<8)switchSection(-1);
 },{passive:true});
}
window.addEventListener('message',async e=>{
 if(e.origin!==location.origin)return;
 if(e.data?.type==='MOBI_NOTE_UPSERT'){updateMobiNote(e.data.note);return}
 if(e.data?.type==='MOBI_NOTE_REMOVE'){const note=e.data.note;if(note){removeMobiNote(note);noteMap.delete(note.id)}return}
 if(e.data?.type==='MOBI_GOTO_CFI'){if(e.data.cfi&&view)try{await view.goTo(e.data.cfi)}catch(err){console.warn(err)}return}
 if(e.data?.type==='ZHJ_CLEAR_SELECTION'){try{for(const x of view?.renderer?.getContents()||[])x.doc?.__zhjSelectionApi?.clear()}catch{}return}
 if(e.data?.type==='MOBI_REQUEST_TOC'){const entries=[];const flatten=items=>{for(const item of items||[]){entries.push({label:item.label||'章节',href:item.href});flatten(item.subitems)}};flatten(view?.book?.toc||[]);window.__tocEntries=entries;parent.postMessage({type:'MOBI_TOC_ENTRIES',entries:entries.map(x=>({label:x.label}))},location.origin);return}
 if(e.data?.type==='MOBI_GOTO_TOC'){const entry=window.__tocEntries?.[e.data.index];if(entry)try{await view.goTo(entry.href)}catch(err){console.warn(err)}return}
 if(e.data?.type==='MOBI_SET_PREFS'){prefs={...prefs,...e.data.prefs};applyPrefs();return}
 if(e.data?.type!=='OPEN_MOBI')return;
 bookId=e.data.bookId;noteMap=new Map((e.data.notes||[]).filter(h=>h.id&&h.note?.trim()).map(h=>[h.id,h]));initialCFI=e.data.cfi||null;initialSection=e.data.sectionIndex??null;prefs={...prefs,...(e.data.prefs||{})};document.getElementById('size').value=prefs.size;document.getElementById('lineHeight').value=prefs.lineHeight;document.getElementById('theme').value=prefs.theme;
 try{
  status.textContent='正在加载 MOBI 阅读引擎…';
  await import('https://cdn.jsdelivr.net/gh/johnfactotum/foliate-js@main/view.js');
  view=document.createElement('foliate-view');
  document.getElementById('holder').append(view);
  await view.open(new File([e.data.buffer],e.data.name,{type:'application/x-mobipocket-ebook'}));
  if(!view.renderer)throw Error('阅读引擎未初始化');
  view.renderer.setAttribute('flow','scrolled');
  view.renderer.setAttribute('margin','0px');
  view.renderer.setAttribute('gap','4%');
  view.renderer.setAttribute('max-inline-size','1000px');
  view.addEventListener('draw-annotation',event=>{try{event.detail.draw(underlinedRects)}catch(err){console.warn(err)}});
  view.addEventListener('show-annotation',event=>{
   const note=[...noteMap.values()].find(h=>h.cfi===event.detail?.value&&h.note?.trim());
   if(note)parent.postMessage({type:'MOBI_INLINE_NOTE',noteId:note.id},location.origin);
  });
  view.renderer.addEventListener('load',event=>{
   wireTouch(event.detail?.doc);
   requestAnimationFrame(()=>{
    normalizeBookHeadings();fixLegacyMobiTitles();
    locateLegacyMobiNotes(event.detail?.doc,event.detail?.index);
    scheduleNoteDrawing();
   });
  });
  view.addEventListener('relocate',ev=>{try{for(const x of view.renderer.getContents())wireTouch(x.doc)}catch{}report(ev.detail);scheduleNoteDrawing()});
  applyPrefs();
  try{if(initialCFI)await view.goTo(initialCFI);else if(initialSection!==null)await view.goTo(initialSection);else await view.goTo(0)}catch{await view.goTo(0)}
  // Chapter navigation is rendered by the parent unified reader panel.
  for(const x of view.renderer.getContents()){wireTouch(x.doc);locateLegacyMobiNotes(x.doc,x.index)}normalizeBookHeadings();fixLegacyMobiTitles();scheduleNoteDrawing();
  status.remove();
 }catch(err){console.error(err);status.textContent='MOBI 打开失败：'+err.message}
});
document.addEventListener('gesturestart', e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});</script></body></html>
