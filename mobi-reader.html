<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{height:100%;margin:0;background:#f6f0e5;color:#343b34;font-family:-apple-system,"PingFang SC",sans-serif}#status{padding:20px}#controls{position:fixed;z-index:10;bottom:0;right:0;left:0;background:#f6f0e5;display:flex;justify-content:space-around;align-items:center;height:48px;border-top:1px solid #e5dbcf}button{font-size:16px;padding:8px 24px;border:0;border-radius:8px;background:#dce8dd}#holder{height:calc(100% - 48px)}foliate-view{display:block;width:100%;height:100%}</style></head><body><div id="status">正在等待 MOBI 文件…</div><div id="holder"></div><div id="controls"><button id="prev">上一页</button><span id="loc"></span><button id="next">下一页</button></div><script type="module">
let view;
const status=document.getElementById('status');
window.addEventListener('message',async e=>{
 if(e.origin!==location.origin||e.data?.type!=='OPEN_MOBI')return;
 try{
  status.textContent='正在加载 MOBI 解析器…';
  await import('https://cdn.jsdelivr.net/gh/johnfactotum/foliate-js@main/view.js');
  status.textContent='正在解析 MOBI 文件…';
  view=document.createElement('foliate-view');
  document.getElementById('holder').append(view);
  await view.open(new File([e.data.buffer],e.data.name,{type:'application/x-mobipocket-ebook'}));
  view.addEventListener('relocate',ev=>{let p=ev.detail?.fraction??ev.detail?.location?.fraction;if(typeof p==='number')document.getElementById('loc').textContent=Math.round(p*100)+'%'});
  await view.goTo(0);status.remove();
 }catch(err){console.error(err);status.textContent='MOBI 打开失败：'+err.message+'。暂不支持 DRM 加密文件。'}
});
document.getElementById('prev').onclick=()=>view?.prev();
document.getElementById('next').onclick=()=>view?.next();
</script></body></html>
