<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f6f0e5;color:#343b34;font-family:-apple-system,"PingFang SC",sans-serif}
#status{padding:20px}#holder{position:absolute;inset:0;width:100%;overflow:hidden}foliate-view{display:block;width:100%;height:100%;touch-action:pan-y pinch-zoom}
</style></head><body><div id="status">正在等待 MOBI 文件…</div><div id="holder"></div><script type="module">
let view,changing=false,lastChange=0;
const status=document.getElementById('status');
async function switchSection(dir){
 if(!view||changing||Date.now()-lastChange<650)return;
 changing=true;
 try{if(dir>0)await view.next();else await view.prev();lastChange=Date.now()}finally{changing=false}
}
function wireTouch(doc){
 if(!doc||doc.__zhijianSwipe)return;
 doc.__zhijianSwipe=true;
 doc.documentElement.style.touchAction='pan-y pinch-zoom';
 doc.body.style.touchAction='pan-y pinch-zoom';
 let startY=0,edge=false;
 doc.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  startY=e.touches[0].clientY;
  const r=view?.renderer;
  edge=!!r&&(r.scrolled && (r.viewSize-r.end<8||r.start<8));
 },{passive:true});
 doc.addEventListener('touchend',e=>{
  if(!edge||!e.changedTouches.length)return;
  const delta=startY-e.changedTouches[0].clientY,r=view?.renderer;
  if(delta>45&&r.viewSize-r.end<12)switchSection(1);
  else if(delta< -45&&r.start<12)switchSection(-1);
 },{passive:true});
 doc.addEventListener('wheel',e=>{
  const r=view?.renderer;
  if(!r?.scrolled)return;
  if(e.deltaY>0&&r.viewSize-r.end<8)switchSection(1);
  if(e.deltaY<0&&r.start<8)switchSection(-1);
 },{passive:true});
}
window.addEventListener('message',async e=>{
 if(e.origin!==location.origin||e.data?.type!=='OPEN_MOBI')return;
 try{
  status.textContent='正在加载 MOBI 阅读引擎…';
  await import('https://cdn.jsdelivr.net/gh/johnfactotum/foliate-js@main/view.js');
  view=document.createElement('foliate-view');
  document.getElementById('holder').append(view);
  await view.open(new File([e.data.buffer],e.data.name,{type:'application/x-mobipocket-ebook'}));
  if(!view.renderer)throw Error('阅读引擎未初始化');
  view.renderer.setAttribute('flow','scrolled');
  view.renderer.setAttribute('margin','0px');
  view.renderer.setAttribute('gap','4%');
  view.renderer.setAttribute('max-inline-size','1000px');
  view.renderer.addEventListener('load',event=>wireTouch(event.detail?.doc));
  view.addEventListener('relocate',()=>{try{for(const x of view.renderer.getContents())wireTouch(x.doc)}catch{}});
  await view.goTo(0);
  for(const x of view.renderer.getContents())wireTouch(x.doc);
  status.remove();
 }catch(err){console.error(err);status.textContent='MOBI 打开失败：'+err.message}
});
</script></body></html>
