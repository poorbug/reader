<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f6f0e5;color:#343b34;font-family:-apple-system,"PingFang SC",sans-serif}
#status{padding:20px}#holder{position:absolute;inset:0;width:100%;overflow:hidden}#menu-toggle{position:fixed;z-index:20;right:12px;bottom:18px;border:0;border-radius:24px;padding:10px 15px;background:#4b8174;color:white}#menu,#toc-panel{position:fixed;z-index:21;bottom:65px;left:12px;right:12px;max-height:65%;overflow:auto;padding:16px;background:#fff;color:#303b33;box-shadow:0 4px 25px #0003;border-radius:14px}#menu[hidden],#toc-panel[hidden]{display:none}.toc-row{display:block;padding:13px 8px;width:100%;background:none;border:0;text-align:left;border-bottom:1px solid #ddd}#menu label{display:block;margin:12px 0}#menu input{width:100%}foliate-view{display:block;width:100%;height:100%;touch-action:pan-y}
</style></head><body><div id="status">正在等待 MOBI 文件…</div><div id="holder"></div><button id="menu-toggle" hidden aria-label="阅读设置">Aa</button><div id="menu" hidden><button id="toc-toggle">目录</button><button id="close-menu">关闭</button><label>字号 <input id="size" type="range" min="14" max="32" value="18"></label><label>行距 <input id="lineHeight" type="range" min="1.3" max="2.5" step="0.1" value="1.8"></label><label>背景 <select id="theme"><option value="paper">纸张</option><option value="white">白色</option><option value="green">护眼</option><option value="dark">夜间</option></select></label></div><div id="toc-panel" hidden></div><script type="module">
let view,changing=false,lastChange=0,bookId=null,initialSection=null,initialCFI=null,prefs={size:18,lineHeight:1.8,theme:'paper'};
const themes={paper:['#f6f0e5','#333b34'],white:['#ffffff','#222222'],green:['#e6eee6','#294034'],dark:['#26292b','#eeeeee']};
function applyPrefs(){if(!view?.renderer)return;const [bg,fg]=themes[prefs.theme]||themes.paper;document.body.style.background=bg;document.body.style.color=fg;view.renderer.setStyles?.(`html,body{background:${bg}!important;color:${fg}!important;font-size:${prefs.size}px!important;line-height:${prefs.lineHeight}!important} body{padding-inline:${prefs.margin||18}px!important;box-sizing:border-box!important} p{margin-bottom:${prefs.paragraph??0.8}em!important}`)}
function report(detail){let cfi=detail?.cfi||detail?.start?.cfi||detail?.location?.cfi||null;let percent=detail?.fraction??detail?.location?.fraction??null;parent.postMessage({type:'MOBI_PROGRESS',bookId,cfi,percent,sectionIndex:detail?.index??detail?.location?.index??null},location.origin)}
function renderToc(){const toc=view?.book?.toc||[];const draw=items=>items.map(item=>`<button class="toc-row" data-href="${String(item.href||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${String(item.label||'章节').replace(/</g,'&lt;')}</button>${draw(item.subitems||[])}`).join('');let panel=document.querySelector('#toc-panel');panel.innerHTML='<button id="toc-close" class="toc-row">✕ 关闭目录</button>'+draw(toc);panel.querySelector('#toc-close').onclick=()=>panel.hidden=true;panel.querySelectorAll('[data-href]').forEach(el=>el.onclick=async()=>{try{await view.goTo(el.dataset.href);panel.hidden=true}catch(e){console.warn(e)}})}
const status=document.getElementById('status');
const menu=document.getElementById('menu');document.getElementById('menu-toggle').onclick=()=>menu.hidden=!menu.hidden;document.getElementById('toc-toggle').onclick=()=>{document.getElementById('toc-panel').hidden=false;menu.hidden=true};document.getElementById('close-menu').onclick=()=>menu.hidden=true;for(const key of ['size','lineHeight'])document.getElementById(key).oninput=e=>{prefs[key]=Number(e.target.value);applyPrefs();parent.postMessage({type:'MOBI_PREFS',prefs},location.origin)};document.getElementById('theme').onchange=e=>{prefs.theme=e.target.value;applyPrefs();parent.postMessage({type:'MOBI_PREFS',prefs},location.origin)};
async function switchSection(dir){
 if(!view||changing||Date.now()-lastChange<650)return;
 changing=true;
 try{if(dir>0)await view.next();else await view.prev();lastChange=Date.now()}finally{changing=false}
}
function wireTouch(doc){
 if(!doc||doc.__zhijianSwipe)return;
 doc.__zhijianSwipe=true;
 doc.documentElement.style.touchAction='pan-y';
 doc.body.style.touchAction='pan-y';
 let tapStartX=0,tapStartY=0,tapStartTime=0;
 doc.addEventListener('touchstart',ev=>{if(ev.touches.length!==1)return;tapStartX=ev.touches[0].clientX;tapStartY=ev.touches[0].clientY;tapStartTime=Date.now()},{passive:true});
 doc.addEventListener('touchend',ev=>{if(!ev.changedTouches.length||Date.now()-tapStartTime>350)return;const t=ev.changedTouches[0];if(Math.abs(t.clientX-tapStartX)>12||Math.abs(t.clientY-tapStartY)>12)return;if(doc.getSelection()?.toString())return;parent.postMessage({type:'READER_TAP'},location.origin)},{passive:true});
 let startY=0,edge=false;
 doc.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  startY=e.touches[0].clientY;
  const r=view?.renderer;
  edge=!!r&&(r.scrolled && (r.viewSize-r.end<8||r.start<8));
 },{passive:true});
 doc.addEventListener('touchend',e=>{
  if(!edge||!e.changedTouches.length)return;
  const delta=startY-e.changedTouches[0].clientY,r=view?.renderer;
  if(delta>45&&r.viewSize-r.end<12)switchSection(1);
  else if(delta< -45&&r.start<12)switchSection(-1);
 },{passive:true});
 doc.addEventListener('wheel',e=>{
  const r=view?.renderer;
  if(!r?.scrolled)return;
  if(e.deltaY>0&&r.viewSize-r.end<8)switchSection(1);
  if(e.deltaY<0&&r.start<8)switchSection(-1);
 },{passive:true});
}
window.addEventListener('message',async e=>{
 if(e.origin!==location.origin)return;
 if(e.data?.type==='MOBI_SHOW_TOC'){document.getElementById('toc-panel').hidden=false;return}
 if(e.data?.type==='MOBI_SET_PREFS'){prefs={...prefs,...e.data.prefs};applyPrefs();return}
 if(e.data?.type!=='OPEN_MOBI')return;
 bookId=e.data.bookId;initialCFI=e.data.cfi||null;initialSection=e.data.sectionIndex??null;prefs={...prefs,...(e.data.prefs||{})};document.getElementById('size').value=prefs.size;document.getElementById('lineHeight').value=prefs.lineHeight;document.getElementById('theme').value=prefs.theme;
 try{
  status.textContent='正在加载 MOBI 阅读引擎…';
  await import('https://cdn.jsdelivr.net/gh/johnfactotum/foliate-js@main/view.js');
  view=document.createElement('foliate-view');
  document.getElementById('holder').append(view);
  await view.open(new File([e.data.buffer],e.data.name,{type:'application/x-mobipocket-ebook'}));
  if(!view.renderer)throw Error('阅读引擎未初始化');
  view.renderer.setAttribute('flow','scrolled');
  view.renderer.setAttribute('margin','0px');
  view.renderer.setAttribute('gap','4%');
  view.renderer.setAttribute('max-inline-size','1000px');
  view.renderer.addEventListener('load',event=>wireTouch(event.detail?.doc));
  view.addEventListener('relocate',ev=>{try{for(const x of view.renderer.getContents())wireTouch(x.doc)}catch{}report(ev.detail)});
  applyPrefs();
  try{if(initialCFI)await view.goTo(initialCFI);else if(initialSection!==null)await view.goTo(initialSection);else await view.goTo(0)}catch{await view.goTo(0)}
  renderToc();
  for(const x of view.renderer.getContents())wireTouch(x.doc);
  status.remove();
 }catch(err){console.error(err);status.textContent='MOBI 打开失败：'+err.message}
});
document.addEventListener('gesturestart', e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});</script></body></html>
