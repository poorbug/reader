function applyStyles(doc){

 style.textContent='html,body{height:auto!important;min-height:0!important;overflow:visible!important;background:'+bg+'!important;color:'+fg+'!important}html{margin:0!important;padding:0!important}body{box-sizing:border-box!important;width:auto!important;margin:0!important;padding:18px '+(readerPrefs.margin||18)+'px 12px!important;font-family:-apple-system,"PingFang SC",sans-serif!important;font-size:'+fontSize+'px!important;line-height:'+(readerPrefs.lineHeight||1.8)+'!important}p{margin-bottom:'+(readerPrefs.paragraph??0.8)+'em!important}h1{font-size:'+Math.min(40,Math.round(fontSize*1.4))+'px!important}h2{font-size:'+Math.round(fontSize*1.2)+'px!important}h3{font-size:'+Math.round(fontSize*1.1)+'px!important}img,svg,video,table{max-width:100%!important}';

}

}

// Recover older MOBI text notes saved before positional CFI support.
// Only unique matches are accepted; ambiguous matches stay unlocated.

function locateLegacyMobiNotes(item){

  if(!note?.id||note.cfi)continue;
  const range=legacyMobiQuoteRange(doc,note.text);
  if(!range)continue;
  const cfi=getSelectedCFI(item.index,range);

}

function noteAtPoint(doc,x,y){

  const r=hits[i];

function release(item){

function activeIndex(){

  const mid=(lo+hi)>>1,item=items[mid];
  if(item.el.offsetTop+item.el.offsetHeight>y){found=mid;hi=mid-1}

function updateActive(){

  persist({progress:{index:current,fraction}});

function pruneChapters(){

function loadNearby(){

   if(typeof value==='number')offset=value*item.height;
   else if(value?.getBoundingClientRect)offset=value.getBoundingClientRect().top+(item.frame.contentDocument.defaultView.scrollY||0);
  }catch(e){logger('目录定位失败：'+e.message)}
 }
 $('#scroll').scrollTop=item.el.offsetTop+offset;
 hidePanels();scheduleActive();
}
function tocEntries(list,depth=0){
 return (list||[]).flatMap(x=>[{...x,depth},...tocEntries(x.subitems,depth+1)]);
}
function renderPanel(kind){
 const body=$('#panel-body');body.replaceChildren();$('#panel').classList.add('visible');$('#toolbar').classList.remove('visible');
 if(kind==='toc'){
  const title=document.createElement('h3');title.textContent='目录';body.append(title);
  for(const entry of tocEntries(book?.toc)){
   const btn=document.createElement('button');btn.className='entry';btn.style.paddingLeft=(entry.depth*15+6)+'px';btn.textContent=entry.label||'章节';
   btn.onclick=()=>goTo(book?.resolveHref?.(entry.href));
   body.append(btn);
  }
 }else{
  const title=document.createElement('h3');title.textContent='本书笔记';body.append(title);
  for(const note of records){
   const row=document.createElement('div');row.className='row';
   const quote=document.createElement('p');quote.style.flexBasis='100%';quote.textContent=note.text+(note.note?' · '+note.note:'');
   const jump=document.createElement('button');jump.textContent='回到原文';jump.onclick=()=>goTo(resolveCFI(note.cfi));
   const remove=document.createElement('button');remove.textContent='删除';remove.onclick=()=>{records=records.filter(x=>x.id!==note.id);persist({notes:records});redrawNotes();renderPanel('notes')};
   row.append(quote,jump,remove);body.append(row);
  }
  if(!records.length)body.textContent='暂无笔记';
 }
}
function redrawNotes(){for(const item of items){if(item.state==='ready')createUnderlines(item)}}
function saveNote(withNote){
 if(embedded||!selected)return;
 const entry={id:crypto.randomUUID(),text:selected.text,cfi:getSelectedCFI(selected.index,selected.range),note:'',createdAt:Date.now()};
 if(withNote){const note=prompt('笔记内容：','');if(note===null)return;entry.note=note}
 records.push(entry);persist({notes:records});redrawNotes();clearSelection();logger('已保存'+(withNote?'笔记':'划线'));
}
async function openFile(file,options={}){
 const gen=++generation;clearTimeout(settleTimer);lastScrollAt=0;bookOptions=options;embeddedBookId=options.bookId||null;activeBookFormat=options.format||'epub';readerPrefs={...readerPrefs,...(options.prefs||{})};fontSize=Number(readerPrefs.size)||19;$('#status').textContent='正在解析 '+file.name+' …';
 const loading=$('#reader-loading');if(embedded){loading.hidden=false;loading.textContent='正在加载 '+activeBookFormat.toUpperCase()+' 阅读引擎…'}
 clearSelection();hidePanels();
 const old=book;for(const it of items){it.observer?.disconnect();if(it.measureFrame)cancelAnimationFrame(it.measureFrame);try{old?.sections?.[it.index]?.unload?.()}catch{}}
 old?.destroy?.();book=null;items=[];$('#scroll').replaceChildren();$('#scroll').scrollTop=0;$('#progress').hidden=true;
 try{
  if(file.size>(embedded?250*1024*1024:MAX_SIZE))throw Error('文件体积超过当前阅读器限制');
  const [hash,bytes]=await hashFile(file);if(gen!==generation)return;
  const module=await import('./vendor/foliate-js/view.js');
  CFI=await import('./vendor/foliate-js/epubcfi.js');
  book=await module.makeBook(new File([bytes],file.name,{type:file.type}));
  if(gen!==generation)return;
  if(book.rendition?.layout==='pre-paginated')throw Error('测试页暂不支持固定排版 EPUB');
  key=hash;records=embedded?(Array.isArray(options.notes)?options.notes:[]):(Array.isArray(readStorage().notes)?readStorage().notes:[]);
  const root=$('#scroll');
  for(let i=0;i<book.sections.length;i++){
   const section=document.createElement('section');section.className='chapter placeholder';
   section.dataset.index=i;
   const skip=book.sections[i]?.linear==='no'||typeof book.sections[i]?.load!=='function';
   const item={index:i,el:section,frame:null,height:skip?0:Math.max(250,root.clientHeight),
    state:skip?'skipped':'idle',observer:null,measureFrame:null,pendingHeight:null,onReady:[]};
   section.style.height=item.height+'px';root.append(section);items.push(item);
  }
  restoring=true;
  const saved=embedded?{index:options.sectionIndex,fraction:options.sectionFraction}:readStorage().progress;
  const cfiTarget=embedded&&options.cfi?resolveCFI(options.cfi):null;
  current=Number.isInteger(cfiTarget?.index)?cfiTarget.index:(Number.isInteger(saved?.index)?Math.max(0,Math.min(items.length-1,saved.index)):0);
  current=Math.max(0,Math.min(items.length-1,current));
  if(items[current]?.state==='skipped'){
   const next=items.slice(current).find(item=>item.state!=='skipped');
   const previous=items.slice(0,current).reverse().find(item=>item.state!=='skipped');
   current=(next||previous)?.index??0;
  }
  if(items[current]?.state==='skipped')throw Error('电子书没有可阅读章节');
  loadNearby();
  const item=items[current];if(item.state!=='ready')await new Promise(resolve=>{item.onReady.push(resolve);mount(item,gen)});
  if(item.state!=='ready')throw Error('无法加载初始章节');
  root.scrollTop=item.el.offsetTop+(saved?.fraction||0)*Math.max(0,item.height-root.clientHeight);
  if(cfiTarget?.anchor&&(options.restoreExact||typeof options.sectionFraction!=='number'||!Number.isFinite(options.sectionFraction))){try{const anchor=cfiTarget.anchor(item.frame.contentDocument);let y=0;if(typeof anchor==='number')y=anchor*item.height;else if(anchor?.getBoundingClientRect)y=anchor.getBoundingClientRect().top;root.scrollTop=item.el.offsetTop+y}catch(error){console.warn('Restore CFI failed',error)}}
  restoring=false;updateActive();
  $('#status').textContent=(book.metadata?.title||file.name)+' · '+book.sections.length+' 章 · 多章节连续滚动';
  logger('已加载 '+book.sections.length+' 个章节占位，实际同时保留最多 '+MAX_ACTIVE+' 个章节');
  if(embedded){loading.hidden=true;tell('READER_READY',{format:activeBookFormat})}
 }catch(e){restoring=false;$('#status').textContent='打开失败：'+e.message;logger('打开失败 '+e.message);console.error(e);if(embedded){loading.hidden=false;loading.textContent=activeBookFormat.toUpperCase()+' 打开失败：'+e.message;tell('READER_ERROR',{message:e.message})}}
}
$('#file').onchange=e=>openFile(e.target.files[0]);
$('#load-url').onclick=async()=>{
 const btn=$('#load-url');btn.disabled=true;
 try{
  let address=new URL($('#url').value.trim());if(address.protocol!=='https:')throw Error('请输入 HTTPS 文件地址');
  if(address.hostname==='github.com'){const m=address.pathname.match(/^\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/);
   if(m)address=new URL(m[1]==='poorbug'&&m[2]==='reader'&&m[3]==='main'?'https://poorbug.github.io/reader/'+m[4]:'https://raw.githubusercontent.com/'+m[1]+'/'+m[2]+'/'+m[3]+'/'+m[4])}
  const response=await fetch(address,{credentials:'omit',mode:'cors'});if(!response.ok)throw Error('HTTP '+response.status);
  const blob=await response.blob();if(blob.size>MAX_SIZE)throw Error('文件超过 30MB');
  let name=decodeURIComponent(address.pathname.split('/').at(-1)||'book.epub');if(!/\.(epub|mobi)$/i.test(name))name+='.epub';
  await openFile(new File([blob],name,{type:blob.type}));
 }catch(e){$('#status').textContent='地址导入失败：'+e.message}
 finally{btn.disabled=false}
};
// Only a genuine gesture should dismiss reader chrome. Layout compensation,
// late font loading and scroll restoration also fire 'scroll' events.
let userScrollGestureUntil=0;
$('#scroll').addEventListener('touchmove',()=>{userScrollGestureUntil=Date.now()+500},{passive:true});
$('#scroll').addEventListener('wheel',()=>{userScrollGestureUntil=Date.now()+500},{passive:true});
$('#scroll').addEventListener('scroll',()=>{lastScrollAt=Date.now();scheduleActive();scheduleIdleMaintenance();if(embedded&&Date.now()<userScrollGestureUntil)tell('READER_SCROLL')},{passive:true});
$('#toc').onclick=()=>renderPanel('toc');$('#notes').onclick=()=>renderPanel('notes');
$('#panel-close').onclick=()=>$('#panel').classList.remove('visible');
$('#hide').onclick=()=>$('#toolbar').classList.remove('visible');
$('#minus').onclick=()=>{fontSize=Math.max(14,fontSize-2);setPreferences({...readerPrefs,size:fontSize})};
$('#plus').onclick=()=>{fontSize=Math.min(32,fontSize+2);setPreferences({...readerPrefs,size:fontSize})};
$('#mark').onclick=()=>saveNote(false);$('#note').onclick=()=>saveNote(true);
$('#clear').onclick=clearSelection;
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(selected?.text||'')}catch{}clearSelection()};
window.addEventListener('message',async event=>{
 if(!embedded||event.origin!==location.origin)return;
 const message=event.data||{};
 if(message.type==='OPEN_BOOK'){
  const bytes=message.buffer;if(!bytes)return;
  await openFile(new File([bytes],message.name||'book.'+(message.format||'epub'),{type:message.format==='mobi'?'application/x-mobipocket-ebook':'application/epub+zip'}),message);
 }else if(message.type==='MOBI_SET_PREFS')setPreferences(message.prefs);
 else if(message.type==='ZHJ_CLEAR_SELECTION')clearSelection();
 else if(message.type==='MOBI_REQUEST_TOC'){
  const flatten=list=>(list||[]).flatMap(x=>[{label:x.label||'章节',href:x.href},...flatten(x.subitems)]);
  window.__parentToc=flatten(book?.toc);
  tell('MOBI_TOC_ENTRIES',{entries:window.__parentToc.map(({label})=>({label}))});
 }else if(message.type==='MOBI_GOTO_TOC'){
  const item=window.__parentToc?.[message.index];if(item)await goTo(book?.resolveHref?.(item.href));
 }else if(message.type==='MOBI_GOTO_CFI')await goTo(resolveCFI(message.cfi));
 else if(message.type==='MOBI_NOTE_UPSERT'){
  if(!message.note?.id)return;
  records=records.filter(x=>x.id!==message.note.id);records.push(message.note);redrawNotes();
 }else if(message.type==='MOBI_NOTE_REMOVE'){
  records=records.filter(x=>x.id!==message.note?.id);redrawNotes();
 }
});
</script></body></html>
