<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>html,body{height:100%;margin:0;background:#f6f0e5;color:#252525}#pages{height:100%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}canvas{display:block;max-width:100%;height:auto;margin:0 auto 10px;box-shadow:0 1px 5px #0002}#status{padding:22px;font:15px -apple-system,sans-serif}.page{min-height:100px}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script></head><body><div id="status">正在打开 PDF…</div><div id="pages"></div><script>
let pdf=null,controller=null;
async function renderAll(data){const status=document.getElementById('status'),pages=document.getElementById('pages');if(!window.pdfjsLib)throw Error('PDF 引擎加载失败，请联网重试');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdf=await pdfjsLib.getDocument({data:new Uint8Array(data)}).promise;status.textContent='正在准备 '+pdf.numPages+' 页…';pages.innerHTML='';controller=new AbortController();const signal=controller.signal;const watcher=new IntersectionObserver(async entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;const el=entry.target;watcher.unobserve(el);try{let number=Number(el.dataset.page),p=await pdf.getPage(number);if(signal.aborted)return;const dpr=Math.min(devicePixelRatio||1,2),width=Math.max(280,Math.min(pages.clientWidth,1000)),v=p.getViewport({scale:1});const scale=width/v.width,c=p.getViewport({scale:scale*dpr});let canvas=document.createElement('canvas');canvas.width=Math.ceil(c.width);canvas.height=Math.ceil(c.height);canvas.style.width=(c.width/dpr)+'px';canvas.style.height=(c.height/dpr)+'px';el.append(canvas);await p.render({canvasContext:canvas.getContext('2d'),viewport:c}).promise;el.style.minHeight='0'}catch(e){el.textContent='第 '+el.dataset.page+' 页渲染失败：'+e.message}}},{root:pages,rootMargin:'800px'});for(let i=1;i<=pdf.numPages;i++){const el=document.createElement('div');el.className='page';el.dataset.page=i;el.style.minHeight=(pages.clientWidth*1.4)+'px';pages.append(el);watcher.observe(el)}status.remove()}
window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.data?.type!=='OPEN_PDF')return;try{await renderAll(e.data.buffer)}catch(err){document.getElementById('status').textContent='PDF 打开失败：'+err.message;console.error(err)}});
document.getElementById('pages').addEventListener('touchmove',()=>parent.postMessage({type:'READER_SCROLL'},location.origin),{passive:true});
</script></body></html>
