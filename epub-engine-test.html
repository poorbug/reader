<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>纸间 · EPUB 引擎兼容性测试</title>
<style>
html,body{height:100%;margin:0;background:#f6f0e5;color:#33453b;font-family:-apple-system,"PingFang SC",sans-serif}
main{display:flex;flex-direction:column;height:100dvh;min-height:0}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:52px;padding:8px 12px;background:#e5ede5}#url{flex:1;min-width:140px;padding:8px;border:1px solid #b2c7b8;border-radius:7px}#load-url{padding:8px 10px}#status{width:100%;flex-basis:100%}
#file{max-width:50%;font-size:12px}#status{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reader{flex:1;min-height:0;position:relative;overflow:hidden}
foliate-view{display:block;width:100%;height:100%;touch-action:pan-y}
#toolbar{display:none;position:absolute;left:0;right:0;bottom:0;padding:13px;background:#294739;color:white;z-index:20;gap:12px}
#toolbar.visible{display:flex}
#toc{display:none;position:absolute;inset:15% 7% 12%;z-index:21;background:#f6f0e5;overflow:auto;padding:14px;box-shadow:0 6px 24px #0005}
#toc.visible{display:block}#toc button{display:block;width:100%;text-align:left;padding:10px;background:none;border:0;border-bottom:1px solid #ddd}
button{cursor:pointer}#notes{display:none;position:absolute;inset:14% 6% 12%;z-index:23;background:#f6f0e5;overflow:auto;padding:15px;box-shadow:0 6px 24px #0005}#notes.visible{display:block}#notes article{border-bottom:1px solid #cdd8cf;padding:10px 0}#notes article button{margin:4px 5px 4px 0}.note-quote{font-size:13px;color:#50665a;white-space:pre-wrap}.note-comment{font-size:14px;white-space:pre-wrap}#notes-close{float:right}#resume-info{font-size:11px}#selection-actions{display:none;position:absolute;left:12px;right:12px;bottom:72px;z-index:22;justify-content:center;gap:12px;padding:12px;background:#294739;color:white;border-radius:12px}#selection-actions.visible{display:flex}#selection-actions button{border:0;background:transparent;color:white;font-size:14px}#test-log{font-size:11px;padding:5px 10px;max-height:62px;overflow:auto;background:#e2ebe4;white-space:pre-wrap}
</style></head>
<body><main><header><input id="file" type="file" accept=".epub,application/epub+zip"><input id="url" type="url" inputmode="url" placeholder="粘贴 EPUB HTTPS 文件地址"><button id="load-url" type="button">从地址打开</button><span id="status" role="status">请选择文件或输入 EPUB 下载地址</span></header>
<div id="reader"><div id="selection-actions"><button id="sel-copy">复制</button><button id="sel-quote">划线</button><button id="sel-note">笔记</button><button id="sel-clear">取消</button></div><div id="holder" style="height:100%"></div><div id="toc"></div><div id="notes"><button id="notes-close">关闭</button><h3>本书划线与笔记</h3><div id="notes-list"></div></div><nav id="toolbar"><button id="toc-btn">目录</button><button id="notes-btn">笔记</button><button id="smaller">A−</button><button id="larger">A+</button><button id="close">收起</button></nav></div>
<div id="test-log" aria-live="polite">尚未打开书籍</div></main>
<script src="./selection.js"></script><script type="module">
const $=s=>document.querySelector(s);
let view,book,size=18,toc=[],tapCount=0,changing=false,lastChange=0,selectedText='',selectionController=null,selectedRange=null,selectedSection=null,bookKey=null,restoring=false;
let noteStore=[],notesDrawn=new WeakMap(),noteDrawTimer=null;const keyPrefix='zhijian-foliate-epub-test-v1:';
const log=msg=>{$('#test-log').textContent=msg+' | 点击次数 '+tapCount};
const show=()=>{$('#toolbar').classList.toggle('visible');log('工具栏 '+($('#toolbar').classList.contains('visible')?'显示':'隐藏'))};
async function switchSection(dir){
 if(!view||changing||Date.now()-lastChange<650)return;
 const r=view.renderer;if(!r?.scrolled)return;
 changing=true;
 try{if(dir>0)await view.next();else await view.prev();lastChange=Date.now();log(dir>0?'已尝试进入下一章':'已尝试进入上一章')}
 catch(error){log('切换章节失败: '+error.message)}finally{changing=false}
}
function clearSelected(){selectionController?.clear();selectedText='';selectedRange=null;selectedSection=null;$('#selection-actions').classList.remove('visible')}
function wire(doc){
 if(!doc||doc.__zhjTestBound)return;doc.__zhjTestBound=true;
 doc.documentElement.style.touchAction='pan-y';doc.body.style.touchAction='pan-y';
 const ctrl=window.ZhijianSelection?.install(doc,{onChange:detail=>{
  selectedText=detail?.text||'';selectedRange=detail?.range?.cloneRange?.()||null;selectedSection=view?.renderer?.getContents?.().find(x=>x.doc===doc)?.index??null;selectionController=ctrl;
  $('#selection-actions').classList.toggle('visible',!!selectedText);
  if(selectedText){$('#toolbar').classList.remove('visible');log('自定义选词成功: '+selectedText.slice(0,18))}
 }});
 let edge=false,edgeY=0;
 let p=null,lastTouch=0;
 doc.addEventListener('touchstart',e=>{const t=e.touches[0];p=t?{x:t.clientX,y:t.clientY,when:Date.now(),moved:false}:null;edgeY=t?.clientY||0;const r=view?.renderer;edge=!!r?.scrolled&&(r.viewSize-r.end<15||r.start<15)},{capture:true,passive:true});
 doc.addEventListener('touchmove',e=>{const t=e.touches[0];if(t&&p&&Math.hypot(t.clientX-p.x,t.clientY-p.y)>12)p.moved=true},{capture:true,passive:true});
 doc.addEventListener('touchend',e=>{const t=e.changedTouches[0],v=p;p=null;if(!t)return;
 if(edge&&!doc.__zhijianSelecting&&!doc.__zhijianSelectionActive){const delta=edgeY-t.clientY,r=view?.renderer;if(delta>48&&r?.viewSize-r?.end<18)switchSection(1);else if(delta< -48&&r?.start<18)switchSection(-1)}
 if(!v||v.moved||Date.now()-v.when>380||Math.hypot(t.clientX-v.x,t.clientY-v.y)>12||e.target.closest?.('a,button')||doc.__zhijianSelecting||doc.__zhijianSelectionActive)return;lastTouch=Date.now();tapCount++;show()},{capture:true,passive:true});
 doc.addEventListener('click',e=>{if(Date.now()-lastTouch<700||e.target.closest?.('a,button')||doc.__zhijianSelecting||doc.__zhijianSelectionActive)return;tapCount++;show()},{capture:true});
 doc.addEventListener('wheel',e=>{const r=view?.renderer;if(!r?.scrolled)return;if(e.deltaY>0&&r.viewSize-r.end<12)switchSection(1);else if(e.deltaY<0&&r.start<12)switchSection(-1)},{passive:true});
}
function setPrefs(){view?.renderer?.setStyles?.('html,body{font-size:'+size+'px!important;line-height:1.8!important;background:#f6f0e5!important;color:#33453b!important}')}
function saveTestState(patch){
 if(!bookKey)return;
 try{const key=keyPrefix+bookKey;const prev=JSON.parse(localStorage.getItem(key)||'{}');localStorage.setItem(key,JSON.stringify({...prev,...patch,updatedAt:Date.now()}))}
 catch(error){log('存储失败: '+error.message)}
}
function loadTestState(){
 if(!bookKey)return {};
 try{return JSON.parse(localStorage.getItem(keyPrefix+bookKey)||'{}')}catch{return {}}
}
function markTextLocation(){
 if(!selectedRange||selectedSection===null||!view)return null;
 try{return view.getCFI(selectedSection,selectedRange)}catch(error){log('CFI 定位失败: '+error.message);return null}
}
function underlineRects(rects){
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('fill','#4b8174');
 for(const r of rects){const line=document.createElementNS('http://www.w3.org/2000/svg','rect');line.setAttribute('x',r.left);line.setAttribute('y',r.bottom-2.5);line.setAttribute('width',r.width);line.setAttribute('height',2.5);g.append(line)}
 return g;
}
function drawSavedNotes(){
 if(!view?.renderer)return;
 for(const section of view.renderer.getContents()){
  if(!section.doc||typeof section.index!=='number')continue;
  let drawn=notesDrawn.get(section.doc);if(!drawn){drawn=new Set();notesDrawn.set(section.doc,drawn)}
  for(const n of noteStore){
   if(!n.cfi||drawn.has(n.cfi))continue;
   try{if(view.resolveNavigation(n.cfi)?.index!==section.index)continue;
    drawn.add(n.cfi);Promise.resolve(view.addAnnotation({value:n.cfi})).catch(err=>{drawn.delete(n.cfi);console.warn(err)})
   }catch(err){console.warn('注释定位失败',err)}
  }
 }
}
function scheduleNoteDraw(){clearTimeout(noteDrawTimer);noteDrawTimer=setTimeout(drawSavedNotes,120)}
function renderNotes(){
 const list=$('#notes-list');list.replaceChildren();
 if(!noteStore.length){list.textContent='暂无记录。长按正文后选择划线或笔记。';return}
 for(const n of [...noteStore].reverse()){
  const row=document.createElement('article');
  const quote=document.createElement('div');quote.className='note-quote';quote.textContent=n.text;
  const note=document.createElement('div');note.className='note-comment';note.textContent=n.note||'';
  const jump=document.createElement('button');jump.textContent='回到原文';jump.disabled=!n.cfi;jump.onclick=async()=>{try{await view.goTo(n.cfi);$('#notes').classList.remove('visible');log('已跳转到笔记原文')}catch(error){log('笔记定位失败: '+error.message)}};
  const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>{const next=prompt('编辑笔记：',n.note||'');if(next===null)return;n.note=next;saveTestState({notes:noteStore});renderNotes()};
  const remove=document.createElement('button');remove.textContent='删除';remove.onclick=()=>{noteStore=noteStore.filter(x=>x.id!==n.id);if(n.cfi)view.deleteAnnotation({value:n.cfi})?.catch?.(console.warn);notesDrawn=new WeakMap();saveTestState({notes:noteStore});renderNotes()};
  row.append(quote,note,jump,edit,remove);list.append(row);
 }
}
function saveSelected(withNote){
 if(!selectedText)return;
 const value=withNote?prompt('写下你的笔记：',''):'';
 if(value===null)return;
 const cfi=markTextLocation();
 const entry={id:crypto.randomUUID(),text:selectedText,cfi,note:value||'',createdAt:Date.now()};
 noteStore.push(entry);saveTestState({notes:noteStore});scheduleNoteDraw();renderNotes();clearSelected();log('已保存'+(withNote?'笔记':'划线')+(cfi?'（包含定位）':'（暂时无法定位）'));
}
const flatten=items=>(items||[]).flatMap(x=>[x,...flatten(x.subitems)]);
async function openFile(file){
 if(!file)return;
 bookKey=null;noteStore=[];notesDrawn=new WeakMap();
 $('#status').textContent='正在解析 EPUB…';selectedText='';selectionController=null;$('#selection-actions').classList.remove('visible');$('#holder').replaceChildren();$('#toc').classList.remove('visible');$('#toolbar').classList.remove('visible');
 try{
  await import('./vendor/foliate-js/view.js');
  view=document.createElement('foliate-view');$('#holder').append(view);
  const buffer=await file.arrayBuffer();const digest=await crypto.subtle.digest('SHA-256',buffer);bookKey=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
  await view.open(new File([buffer],file.name,{type:file.type||'application/epub+zip'}));book=view.book;
  if(!view.renderer)throw Error('foliate-js renderer 未初始化');
  view.renderer.setAttribute('flow','scrolled');view.renderer.setAttribute('margin','0px');view.renderer.setAttribute('max-inline-size','1000px');
  view.renderer.addEventListener('load',e=>{wire(e.detail?.doc);scheduleNoteDraw()});
  view.addEventListener('relocate',event=>{
   for(const item of view.renderer.getContents())wire(item.doc);
   scheduleNoteDraw();
   if(restoring)return;
   const d=event.detail||{};const cfi=d.cfi||d.start?.cfi||d.location?.cfi;
   if(cfi)saveTestState({progress:cfi});
  });
  view.addEventListener('draw-annotation',event=>{try{event.detail.draw(underlineRects)}catch(error){console.warn('绘制下划线失败',error)}});
  setPrefs();const saved=loadTestState();noteStore=Array.isArray(saved.notes)?saved.notes:[];
  restoring=true;try{if(saved.progress){try{await view.goTo(saved.progress);log('已恢复上次阅读位置')}catch(e){await view.goTo(0);log('旧进度无效，已从开头打开')}}else await view.goTo(0)}finally{restoring=false}
  renderNotes();scheduleNoteDraw();
  for(const item of view.renderer.getContents())wire(item.doc);
  toc=flatten(book.toc);$('#toc').innerHTML='';
  for(const entry of toc){const btn=document.createElement('button');btn.textContent=entry.label||'章节';btn.onclick=async()=>{await view.goTo(entry.href);$('#toc').classList.remove('visible')};$('#toc').append(btn)}
  $('#status').textContent='EPUB 已打开 · '+(book.metadata?.title||file.name);log('已打开 EPUB；轻点正文测试菜单');
 }catch(error){console.error(error);$('#status').textContent='EPUB 打开失败: '+error.message;log('打开失败 '+error.message)}
}
$('#file').onchange=event=>openFile(event.target.files?.[0]);
$('#load-url').onclick=async()=>{
 const button=$('#load-url');button.disabled=true;
 try{
  let url=new URL($('#url').value.trim(),location.href);
  if(url.protocol!=='https:'&&!(url.protocol==='http:'&&url.hostname==='localhost'))throw Error('请使用 HTTPS EPUB 文件地址');
  if(url.username||url.password)throw Error('地址不能包含账号或密码');
  if(url.hostname==='github.com'){
   const match=url.pathname.match(/^\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/);
   if(match){const [,owner,repository,branch,file]=match;
    url=new URL(owner==='poorbug'&&repository==='reader'&&branch==='main'?'https://poorbug.github.io/reader/'+file:'https://raw.githubusercontent.com/'+owner+'/'+repository+'/'+branch+'/'+file);
   }
  }
  $('#status').textContent='正在下载 EPUB…';
  const response=await fetch(url.href,{mode:'cors',credentials:'omit'});
  if(!response.ok)throw Error('下载失败 HTTP '+response.status);
  const limit=30*1024*1024;
  if(Number(response.headers.get('content-length'))>limit)throw Error('文件超过 30MB');
  const blob=await response.blob();if(blob.size>limit)throw Error('文件超过 30MB');
  const head=new Uint8Array(await blob.slice(0,4).arrayBuffer());if(head[0]!==80||head[1]!==75)throw Error('下载结果不是 EPUB ZIP 文件');
  const name=decodeURIComponent(url.pathname.split('/').pop()||'online.epub');
  await openFile(new File([blob],name.toLowerCase().endsWith('.epub')?name:name+'.epub',{type:'application/epub+zip'}));
 }catch(error){$('#status').textContent='地址导入失败：'+error.message;log('地址导入失败 '+error.message)}finally{button.disabled=false}
};
$('#sel-copy').onclick=async()=>{try{await navigator.clipboard.writeText(selectedText);log('已复制选中文字')}catch{log('复制失败')}clearSelected()};
$('#sel-quote').onclick=()=>saveSelected(false);
$('#sel-note').onclick=()=>saveSelected(true);
$('#sel-clear').onclick=clearSelected;
$('#toc-btn').onclick=()=>$('#toc').classList.toggle('visible');
$('#notes-btn').onclick=()=>{$('#notes').classList.toggle('visible');renderNotes()};
$('#notes-close').onclick=()=>$('#notes').classList.remove('visible');
$('#smaller').onclick=()=>{size=Math.max(14,size-2);setPrefs()};
$('#larger').onclick=()=>{size=Math.min(32,size+2);setPrefs()};
$('#close').onclick=()=>$('#toolbar').classList.remove('visible');
</script></body></html>
